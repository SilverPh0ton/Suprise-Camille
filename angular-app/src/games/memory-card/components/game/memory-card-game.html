<div class="flex flex-col h-dvh bg-[url(/background/cottagecore-digital-art.jpg)] bg-no-repeat bg-cover bg-center">

  <game-header
    title="Jeu d'association"
    progressLabelBase="pair"
    [nbrOfItemsResolved]="memoryCardsStore.nbrOfResolvedCards() / 2"
    [nbrOfAttempt]="memoryCardsStore.nbrOfAttempt()"
    [progressPercentage]="memoryCardsStore.progressPercentage()"
    (resetGame)="resetGame()"
  />

  <div class="flex gap-2 p-2 flex-wrap justify-center content-center grow">
    @for (card of memoryCardsStore.entities(); track card.id) {
      <memory-card
        [id]="card.id"
        [src]="card.src"
        [isFlipped]="card.isOpen"
        [isResolved]="card.isResolved"
        (cardSelected)="memoryCardsStore.flipCard(card)"
      />
    }
  </div>
</div>
